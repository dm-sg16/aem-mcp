# Docker Compose stack for the AEM read-only MCP server.
# Replaces the Phase 1 Kubernetes manifest for single-host deployments
# (developer laptops, small VMs). Run with: `docker compose up -d`.
#
# Secrets are stored on the host at ./secrets/aem-mcp-secrets.properties
# (gitignored) and mounted into the container at /run/secrets/<name>.
# Spring Boot reads them via spring.config.import in application.yml,
# so they never appear in `docker inspect` env nor in the process list.

services:
  aem-readonly-mcp:
    build: .
    image: aem-readonly-mcp:1.0.0
    # Build locally; never try to pull `image:` from a registry (it doesn't exist on Docker Hub).
    # Without this, Compose tries `docker pull aem-readonly-mcp:1.0.0` first and prints a noisy
    # "pull access denied" before falling back to the build.
    pull_policy: build
    container_name: aem-readonly-mcp
    restart: unless-stopped
    ports:
      # Bind to loopback by default — this is a developer tool, not a public service.
      # Change to "8080:8080" if you want it reachable from other hosts on the LAN.
      - "127.0.0.1:8080:8080"
    environment:
      # Non-secret config. Override per host as needed.
      AEM_BASE_URL: "https://author.internal.example.com:4502"
      # --- Trusting an internal AEM TLS certificate -------------------------------------------
      # If the AEM connectivity probe reports category "unreachable" and the logs show
      #   SSLHandshakeException: PKIX path building failed ... unable to find valid
      #   certification path to requested target
      # the JVM doesn't trust AEM's certificate (self-signed or internal-CA-issued). Drop a
      # truststore that trusts it at ./certs/java.cacerts — either an org-provided cacerts that
      # already contains your internal CA, or one you build per certs/README.md — then uncomment
      # the volume below plus this JAVA_TOOL_OPTIONS override.
      #
      # NOTE: setting JAVA_TOOL_OPTIONS here REPLACES the image default, so the -Djava.io.tmpdir
      # flag from the Dockerfile must be repeated or the read-only root filesystem breaks /tmp.
      # JAVA_TOOL_OPTIONS: >-
      #   -Djava.io.tmpdir=/tmp
      #   -Djavax.net.ssl.trustStore=/deployments/java.cacerts
      #   -Djavax.net.ssl.trustStorePassword=changeit
    # volumes:
    #   # Read-only mount of the truststore (see certs/README.md). Fine alongside the read_only
    #   # root filesystem below — it's an explicit read-only bind, not a write target.
    #   - ./certs/java.cacerts:/deployments/java.cacerts:ro
    secrets:
      - source: aem-mcp-secrets
        # Mounted at /run/secrets/aem-mcp-secrets.properties inside the container.
        # Spring Boot's spring.config.import in application.yml points here.
        # (`mode:` would be nice here but it's Swarm-only — plain Compose ignores it with a
        # warning. The file is still mounted read-only at the bind-mount level.)
        target: aem-mcp-secrets.properties
    read_only: true
    tmpfs:
      # The image's JAVA_TOOL_OPTIONS sets -Djava.io.tmpdir=/tmp; the read-only root
      # filesystem above means we need a writable tmpfs here. 64 MiB is plenty for a
      # JVM that doesn't write much to /tmp.
      - /tmp:rw,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Lightweight TCP check — the runtime image doesn't ship curl/wget, and we don't
      # want to bloat it for a healthcheck. Compose's TCP probe is enough to know the
      # JVM is listening; Spring Boot's actuator probes are still reachable from the
      # host for richer status.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo ok || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

secrets:
  aem-mcp-secrets:
    file: ./secrets/aem-mcp-secrets.properties
