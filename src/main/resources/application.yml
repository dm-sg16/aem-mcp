server:
  port: 8080

spring:
  application:
    name: aem-readonly-mcp
  # Optional file-mounted secrets. When running under Docker Compose this file is mounted from
  # the host (see compose.yaml). Values defined here override the env-var placeholders below.
  # Missing file is fine — `optional:` prefix makes the import a no-op, and the env-var
  # placeholders take over for plain `java -jar` / `mvn spring-boot:run` workflows.
  config:
    import: optional:file:/run/secrets/aem-mcp-secrets.properties
  ai:
    mcp:
      server:
        name: aem-readonly-mcp
        version: 1.0.0
        type: SYNC
        # Default transport is SSE (endpoint /sse). To use streamable HTTP, change the pom
        # dependency to spring-ai-starter-mcp-server-streamable-webmvc and uncomment:
        # protocol: STREAMABLE
        # streamable-http:
        #   mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false

aem:
  base-url: ${AEM_BASE_URL:https://author.internal.example.com:4502}
  # Optional. Sub-path AEM is deployed under, e.g. "/WC2" — leave empty for root-mounted AEM.
  # When set, it's prepended to every outbound HTTP URI (tools and connectivity probes). JCR
  # paths in `allowed-path-prefixes` and tool arguments stay context-root-independent.
  # Must start with '/' and not end with '/'.
  context-root: ${AEM_CONTEXT_ROOT:}
  username: ${AEM_USERNAME:}
  password: ${AEM_PASSWORD:}
  allowed-path-prefixes:
    - /content/yoursite
    - /content/dam/yoursite
  default-limit: 20
  max-limit: 100
  max-depth: 3
  bundle-health-enabled: false
  health:
    # Path probed by the inspectNode health indicator. Leave unset (or null) to use the first
    # entry of allowed-path-prefixes + ".0.json" — usually fine. Override if your first
    # allow-listed prefix doesn't actually exist in the target AEM yet.
    inspect-node-path:

# Authentication for /sse. During the dual-auth migration window the server accepts EITHER:
#   (a) a valid JWT issued by aem-mcp.oidc.issuer-uri (preferred — per-developer audit), OR
#   (b) the legacy shared bearer token `aem-mcp.token` when aem-mcp.auth.legacy-bearer-enabled=true.
# Once all clients have moved to JWTs (track via `caller=legacy:service-account` in the audit log),
# flip legacy-bearer-enabled to false; the legacy code path is deleted in a follow-up release.
# Cross-field validation in AemMcpAuthProperties requires:
#   - aem-mcp.token non-blank when legacy-bearer-enabled=true
#   - at least one of aem-mcp.oidc.issuer-uri or aem-mcp.oidc.jwk-set-uri set
aem-mcp:
  token: ${AEM_MCP_TOKEN:}
  auth:
    legacy-bearer-enabled: ${AEM_MCP_LEGACY_BEARER_ENABLED:true}
  oidc:
    # OIDC discovery URL. Triggers a discovery call at first request.
    issuer-uri: ${AEM_MCP_OIDC_ISSUER:}
    # JWKS endpoint. Set this OR issuer-uri (jwk-set-uri wins if both are set). Prefer
    # jwk-set-uri in dev/test or when the IDP discovery endpoint isn't reachable.
    jwk-set-uri: ${AEM_MCP_OIDC_JWK_SET_URI:}
    # Optional `aud` claim the JWT must carry. Empty = no audience constraint.
    audience: ${AEM_MCP_OIDC_AUDIENCE:}
    # JWT claim that populates the audit-log `caller` field. Falls back to `sub` when absent
    # (logged once at WARN per process so the fallback is visible). Standard claim names:
    # preferred_username (Okta/Entra/Auth0 default), email, sub.
    principal-claim: preferred_username

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      # Per-tool AEM connectivity probes plus an aggregate. Each tool gets its own group so it
      # has a dedicated /actuator/health/<tool> URL (component-only paths 404 while the global
      # show-details=never is in force). Details are safe to expose for these — no secrets, no
      # base URL, no username — so we override show-details at the group level.
      group:
        aem:
          include:
            - searchContent
            - inspectNode
            - bundleHealth
          show-details: always
        aem-search:
          include:
            - searchContent
          show-details: always
        aem-inspect:
          include:
            - inspectNode
          show-details: always
        aem-bundle:
          include:
            - bundleHealth
          show-details: always

logging:
  structured:
    format:
      console: ecs   # Spring Boot 3.4 built-in JSON encoder; one line per log event, no logback-spring.xml needed.
  level:
    AEM_MCP_AUDIT: INFO
